AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  aws-serverless-todo-api

  Sample SAM Template for aws-serverless-todo-api

Parameters:
  TableName:
    Type: String
    Default: TasksTable
  DynamoEndpoint:
    Type: String
    Default: ""
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173  
  
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 10
    Runtime: nodejs22.x
    Environment:
      Variables:
        TABLE_NAME: !Ref TableName
        DYNAMODB_ENDPOINT: !Ref DynamoEndpoint
  Api:
    Cors:
      AllowOrigin: !Sub "'${FrontendOrigin}'"
      AllowHeaders: "'Content-Type'"
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"



Resources:

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH 
  CreateTaskFunction:
     Type: AWS::Serverless::Function
     Properties:
        CodeUri: src/
        Handler: createTask.handler
        Events:
           CreateTask:
            Type: Api
            Properties:
              Path: /tasks
              Method: post
        Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName     
  GetTaskFunction:
     Type: AWS::Serverless::Function
     Properties:
        CodeUri: src/
        Handler: getTasks.handler
        Events:
            GetTask:
              Type: Api
              Properties:
                 Path: /tasks
                 Method: 
        Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TableName         
  UpdateTaskFunction:
     Type: AWS::Serverless::Function
     Properties:
        CodeUri: src/
        Handler: updateTask.handler
        Events:
            UpdateTask:
              Type: Api
              Properties:
                 Path: /tasks/{id}
                 Method: put
        Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName           
  DeleteTaskFunction:
      Type: AWS::Serverless::Function
      Properties:
            CodeUri: src/
            Handler: deleteTask.handler
            Events:
                DeleteTask:
                  Type: Api
                  Properties:
                    Path: /tasks/{id}
                    Method: delete
            Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName     
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"             
       
       



